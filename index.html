<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Tree</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1b1b1b;
    --muted: #6b6b66;
    --line: #b9b7ae;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --card: #1f1f1e; --ink: #f1f0ec; --muted: #9b9a94;
      --line: #4a4a46; --accent: #7aa2ff; --accent-ink: #0d1b3d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --card: #1f1f1e; --ink: #f1f0ec; --muted: #9b9a94;
    --line: #4a4a46; --accent: #7aa2ff; --accent-ink: #0d1b3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 120px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .restart { margin-top: 10px; background: none; border: 0; color: var(--muted);
    text-decoration: underline; font: inherit; cursor: pointer; }
  .restart[hidden] { display: none; }

  .line { width: 2px; height: 28px; background: var(--line); margin: 0 auto; }
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 18px 20px; text-align: center; max-width: 520px; margin: 0 auto;
  }
  .card .step { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card p { margin: 6px 0 0; font-size: 1.15rem; font-weight: 600; }
  .card .hint { font-size: .95rem; font-weight: 400; color: var(--muted); }
  .names { display: grid; gap: 10px; margin-top: 14px; }
  .names input {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  }

  .opts { display: flex; justify-content: center; gap: 0; flex-wrap: nowrap; }
  .opt { position: relative; padding: 20px 6px 0; flex: 0 1 240px; display: flex; justify-content: center; }
  .opt::before, .opt::after { content: ""; position: absolute; top: 0; height: 20px; width: 50%; border-top: 2px solid var(--line); }
  .opt::before { left: 0; }
  .opt::after { right: 0; border-left: 2px solid var(--line); }
  .opt:first-child::before { border-top: 0; }
  .opt:last-child::after { border-top: 0; }
  .opt button, .go {
    font: inherit; font-weight: 600; width: 100%; padding: 12px 14px; cursor: pointer;
    background: var(--card); color: var(--ink); border: 2px solid var(--accent); border-radius: 12px;
  }
  .go { width: auto; margin-top: 14px; background: var(--accent); color: var(--accent-ink); }
  .opt button:hover, .opt button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
  .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .opt.picked button { background: var(--accent); color: var(--accent-ink); }
  .opt.dim button { border-style: dashed; border-color: var(--line); color: var(--muted); font-weight: 500; }
  .opt.dim button:hover { background: var(--card); color: var(--ink); border-color: var(--accent); }

  .verdict { border-color: var(--accent); border-width: 3px; padding: 26px 22px; }
  .verdict .step { color: var(--accent); }
  .verdict h2 { margin: 6px 0 10px; font-size: 1.8rem; letter-spacing: -0.01em; }
  .verdict p { font-weight: 400; font-size: 1.05rem; }
  .score { margin-top: 10px; color: var(--muted); font-size: .9rem; }
  .after { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .after button { font: inherit; padding: 10px 16px; border-radius: 10px; cursor: pointer;
    background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .after button:hover { border-color: var(--accent); }

  @media (max-width: 640px) {
    .opts { flex-direction: column; align-items: stretch; }
    .opt { flex: none; padding-top: 14px; }
    .opt::before { display: none; }
    .opt::after { width: 0; height: 14px; left: 50%; right: auto; border-top: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card, .opts { animation: rise .25s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Decision Tree</h1>
    <p class="sub">For the person who has to decide.</p>
    <button class="restart" id="restart" hidden>Start over</button>
  </header>
  <div id="flow" aria-live="polite"></div>
</main>

   "Decision Tree". build.py regenerates the block between the
   DATA markers from that note, so edit the note, not this block.
   The code underneath only draws it.

   A scenario has a start node and a set of nodes. Node types:
   - question: { q, hint?, options: [{ t, to, add?: {a, b} }] }
   - names:    { names: true, q, hint?, to }       (asks for two names)
   - verdict:  { verdict, text }                   (the ending)
   - tally:    { tally: true, a, b, tie }          (ending picked by score)
   Text can use {a} and {b} (the two names) and {sa} and {sb} (scores).
   Order of the questions is the order of priority: an early
   answer that ends in a verdict overrides everything after it.
   ============================================================ */

/* ============================================================
   THE DRAWING CODE. Rewinding works by replaying the answers.
   ============================================================ */
const flow = document.getElementById("flow");
const restartBtn = document.getElementById("restart");
const state = { scn: null, picks: [], names: { a: "The one in red", b: "The one in blue" } };

function replay() {
  const sc = state.scn;
  let id = sc.start, steps = [], scores = { a: 0, b: 0 }, held = null;
  const asked = new Set();
  /* A verdict reached before the minimum is held; filler questions run until the minimum, then it shows. */
  const route = (next, now) => {
    const t = sc.nodes[next];
    if (!held && !now && sc.min && t && t.verdict && steps.length < sc.min) held = next;
    if (!held) return next;
    const f = (sc.filler || []).find(x => !asked.has(x));
    return steps.length < sc.min && f ? f : held;
  };
  for (const p of state.picks) {
    const n = sc.nodes[id];
    asked.add(id);
    steps.push({ n, pick: p, filler: !!held });
    if (n.options) {
      const o = n.options[p];
      if (o.add) { scores.a += o.add.a || 0; scores.b += o.add.b || 0; }
      id = route(o.to, o.now);
    } else if (n.names) id = route(n.to);
  }
  return { steps, cur: sc.nodes[id], scores, filler: !!held && id !== held };
}

function fill(text, scores) {
  return text.replace(/\{(a|b|sa|sb)\}/g, (_, k) =>
    k === "a" ? state.names.a : k === "b" ? state.names.b : k === "sa" ? scores.a : scores.b);
}

function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function questionCard(n, label, scores) {
  const c = h("div", "card");
  c.append(h("div", "step", label), h("p", "", fill(n.q, scores)));
  if (n.hint) c.lastChild.append(h("br"), h("span", "hint", fill(n.hint, scores)));
  return c;
}

function optionRow(n, scores, pickedIdx, onPick) {
  const row = h("div", "opts");
  n.options.forEach((o, i) => {
    const wrap = h("div", "opt" + (pickedIdx == null ? "" : i === pickedIdx ? " picked" : " dim"));
    const b = h("button", "", fill(o.t, scores));
    b.type = "button";
    b.addEventListener("click", () => onPick(i));
    wrap.append(b);
    row.append(wrap);
  });
  return row;
}

function verdictCard(v, scores, showScore) {
  const c = h("div", "card verdict");
  c.append(h("div", "step", "Verdict"), h("h2", "", fill(v.verdict, scores)), h("p", "", fill(v.text, scores)));
  if (showScore) c.append(h("div", "score", state.names.a + " " + scores.a + "  |  " + scores.b + " " + state.names.b));
  const after = h("div", "after");
  const again = h("button", "", "Run this one again");
  again.type = "button";
  again.addEventListener("click", () => { state.picks = []; draw(true); });
  const other = h("button", "", "Pick another emergency");
  other.type = "button";
  other.addEventListener("click", () => { state.scn = null; state.picks = []; draw(true); });
  after.append(again, other);
  c.append(after);
  return c;
}

function draw(scroll, scrollTo) {
  flow.replaceChildren();
  restartBtn.hidden = !state.scn;
  let last = null;

  if (!state.scn) {
    const c = h("div", "card");
    c.append(h("div", "step", "Start here"), h("p", "", "Pick the emergency."));
    flow.append(c, h("div", "line"));
    const row = h("div", "opts");
    SCENARIOS.forEach(s => {
      const wrap = h("div", "opt");
      const b = h("button", "", s.title);
      b.type = "button";
      b.title = s.blurb;
      b.addEventListener("click", () => { state.scn = s; state.picks = []; draw(true); });
      wrap.append(b);
      row.append(wrap);
    });
    flow.append(row);
    last = row;
  } else {
    const { steps, cur, scores, filler } = replay();
    steps.forEach((s, i) => {
      const card = questionCard(s.n, "Step " + (i + 1) + (s.filler ? " · for the file" : ""), scores);
      flow.append(card);
      if (s.n.names) {
        card.append(h("div", "hint", state.names.a + " and " + state.names.b));
        flow.append(h("div", "line"));
      } else {
        flow.append(h("div", "line"));
        const row = optionRow(s.n, scores, s.pick, idx => { state.picks = state.picks.slice(0, i).concat(idx); draw(true, i + 1); });
        row.dataset.step = i;
        flow.append(row, h("div", "line"));
      }
      if (scrollTo === i + 1) last = null;
    });
    const stepNo = steps.length + 1;
    if (cur.verdict || cur.tally) {
      const v = cur.tally ? (scores.a > scores.b ? cur.a : scores.b > scores.a ? cur.b : cur.tie) : cur;
      const vc = verdictCard(v, scores, !!cur.tally);
      flow.append(vc);
      last = vc;
    } else {
      const card = questionCard(cur, "Step " + stepNo + (filler ? " · for the file" : ""), scores);
      flow.append(card);
      flow.append(h("div", "line"));
      if (cur.names) {
        const box = h("div", "names");
        const ia = h("input"), ib = h("input");
        ia.placeholder = "First woman"; ib.placeholder = "Second woman";
        ia.value = state.names.a; ib.value = state.names.b;
        ia.setAttribute("aria-label", "First name"); ib.setAttribute("aria-label", "Second name");
        const go = h("button", "go", "Continue");
        go.type = "button";
        go.addEventListener("click", () => {
          state.names.a = ia.value.trim() || "The one on the left";
          state.names.b = ib.value.trim() || "The one on the right";
          state.picks = state.picks.concat(0);
          draw(true);
        });
        box.append(ia, ib);
        card.append(box, go);
        flow.lastChild.remove();
        last = card;
      } else {
        const row = optionRow(cur, scores, null, idx => { state.picks = state.picks.concat(idx); draw(true); });
        flow.append(row);
        last = row;
      }
    }
  }
  if (scroll && last) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const target = scrollTo != null ? flow.querySelector('.opts[data-step="' + (scrollTo - 1) + '"]') || last : last;
    target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    const first = last.querySelector("button, input");
    if (first) first.focus({ preventScroll: true });
  }
}

restartBtn.addEventListener("click", () => { state.scn = null; state.picks = []; draw(true); });
draw(false);
</script>
</body>
</html>
